<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2f5d50">
    <meta name="description" content="Interfaz web del sistema Cafefe.">
    <title>Cafefe | Inicio</title>
    <link rel="stylesheet" href="./src/recursos/estilos/principal.css">
    <link rel="stylesheet" href="./src/recursos/estilos/personal.css">
    <link rel="icon" href="./src/recursos/iconos/icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <script type="module" src="./src/boundary/app.js"></script>
    <link rel="stylesheet" href="./src/recursos/estilos/cobros.css">
</head>
<body>
    <cafefe-app></cafefe-app>
    <noscript>Activa JavaScript para usar Cafefe.</noscript>
    <template id="base-cafefe">
    <!-- Base visual temporal. La navegación se implementará con Web Components. -->
    <div class="aplicacion">
        <header class="encabezado"><button class="menu-alternar" type="button" aria-label="Abrir o cerrar menú" aria-expanded="false" aria-controls="menu-principal">☰</button>
            <div class="marca" aria-label="Cafefe">
    <img class="marca__logo"
         src="./src/recursos/imagenes/marca/200LogoCafefe.png"
         alt=""
         width="64"
         height="64">
    <span class="marca__nombre">CAFEFE</span>
</div>
            <span class="encabezado__estado">Sistema de cafetería</span><button class="instalar cafefe-boton" hidden>Instalar Cafefe</button>
        </header>

        <aside class="barra-lateral" id="menu-principal" aria-label="Navegación principal"><button class="menu-cerrar" type="button" aria-label="Cerrar menú">Cerrar ×</button>
            <p class="barra-lateral__titulo">MENÚ</p>
            <nav class="navegacion" aria-label="Estructura del sistema">
                <span class="navegacion__item navegacion__item--activo" aria-current="page">Inicio</span>
                <span class="navegacion__item">Orden pública</span>
                <span class="navegacion__item">Recepción de órdenes</span>
                <span class="navegacion__item">Pago</span>
                <span class="navegacion__item">Iniciar sesión</span>
            </nav>
            <p class="barra-lateral__nota">Las pantallas se agregarán por etapas.</p>
        </aside>

        <main class="contenido" id="contenido-principal">
            <div class="contenido__cabecera">
                <p class="contenido__etiqueta">PROYECTO PPI115</p>
                <h1>Bienvenido a Cafefe</h1>
                <p class="contenido__descripcion">
                    Esta es la estructura inicial de la aplicación. Por ahora solo
                    estamos definiendo la distribución y el diseño general.
                </p>
            </div>

            <section class="resumen" aria-labelledby="resumen-titulo">
                <h2 id="resumen-titulo">Secciones previstas</h2>
                <div class="tarjetas">
                    <article class="tarjeta">
                        <span class="tarjeta__numero">01</span>
                        <h3>Iniciar sesión</h3>
                        <p>Acceso de empleados según el rol asignado.</p>
                    </article>
                    <article class="tarjeta">
                        <span class="tarjeta__numero">02</span>
                        <h3>Orden pública</h3>
                        <p>Consulta de categorías y selección de productos.</p>
                    </article>
                    <article class="tarjeta">
                        <span class="tarjeta__numero">03</span>
                        <h3>Recepción de órdenes</h3>
                        <p>Vista de pedidos pendientes para preparación.</p>
                    </article>
                    <article class="tarjeta">
                        <span class="tarjeta__numero">04</span>
                        <h3>Pago</h3>
                        <p>Registro de pagos y emisión de comprobantes.</p>
                    </article>
                </div>
            </section>
        </main>

        <footer class="pie"><span class="conexion" role="status"></span><span class="pwa-estado" role="status"></span>
            <span>Cafefe · Universidad de El Salvador</span>
            <span>Base visual inicial</span>
        </footer>
    </div>
    </template>
</body>
</html>
