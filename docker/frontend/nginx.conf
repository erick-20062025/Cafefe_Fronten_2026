user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    # DNS interno: resolver de nuevo cuando se recree el contenedor backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        location ^~ /cafefe/api/ {
            set $backend http://cafefe.backend:9080;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $http_host;
            # Origin se conserva: el backend valida el origen real del navegador.
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_next_upstream off;
            proxy_cache off;
            add_header Cache-Control "no-store" always;
            # Ruta /cafefe se mantiene: no se reescriben cookies ni métodos.
        }
        location = /config/api.js {
            default_type application/javascript;
            add_header Cache-Control "no-store" always;
            return 200 'export const API_URL = new URL("/cafefe/api/", globalThis.location.origin).href;';
        }
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }
        location = /manifest.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
        location ~ /\. { deny all; }
        location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|json)$ { try_files $uri =404; }
        # La SPA usa hash; también permite recarga de rutas sin extensión.
        location / { try_files $uri $uri/ /index.html; }
    }
}
